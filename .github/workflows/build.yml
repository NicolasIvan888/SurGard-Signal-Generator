name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build SurGard-Signal-Generator.slnx -c Release
      - name: Test
        run: dotnet run --project tests/SurGardSignalGenerator.Tests/SurGardSignalGenerator.Tests.csproj -c Release --no-build
